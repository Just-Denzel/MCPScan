rules:
  - id: lectura-ruta-sensible
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: El servidor lee un archivo sensible de credenciales o configuración del usuario.
    metadata:
      categoria: lectura-archivo-sensible
    pattern-sources:
      - patterns:
          - pattern: '"$STR"'
          - metavariable-regex:
              metavariable: $STR
              regex: '(?i)(^|[/\\~])(\.ssh|\.aws|id_rsa|id_ed25519|\.npmrc|\.netrc|\.kube|\.gnupg|\.env(\.[a-z0-9_-]+)?|\.config[/\\](gcloud|gh|kube)|Login Data|key4\.db)($|[/\\])|^/etc/(passwd|shadow)$'
      - patterns:
          - pattern: '`...`'
          - pattern-regex: '(?i)([/\\~](\.ssh|\.aws|id_rsa|id_ed25519|\.npmrc|\.netrc|\.kube|\.gnupg|\.env\b|\.config[/\\](gcloud|gh|kube))|/etc/passwd|/etc/shadow|Login Data|key4\.db)'
    pattern-sinks:
      - pattern: readFile($P, ...)
      - pattern: $FS.readFile($P, ...)
      - pattern: $FS.promises.readFile($P, ...)
      - pattern: readFileSync($P, ...)
      - pattern: $FS.readFileSync($P, ...)
      - pattern: createReadStream($P, ...)
      - pattern: $FS.createReadStream($P, ...)
      - pattern: $FS.open($P, ...)
      - pattern: $FS.openSync($P, ...)

  - id: ruta-archivo-sensible-construida
    languages: [typescript, javascript]
    severity: ERROR
    message: El servidor construye rutas hacia archivos sensibles de credenciales del usuario.
    metadata:
      categoria: lectura-archivo-sensible
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: '$PATH.join(..., "$SEG", ...)'
              - pattern: '$PATH.resolve(..., "$SEG", ...)'
              - pattern: 'join(..., "$SEG", ...)'
              - pattern: 'resolve(..., "$SEG", ...)'
          - metavariable-regex:
              metavariable: $SEG
              regex: '(?i)(^|[/\\~])(\.ssh|\.aws|id_rsa|id_ed25519|\.npmrc|\.netrc|\.kube|\.gnupg|\.config[/\\](gcloud|gh|kube)|Login Data|key4\.db)($|[/\\])|^/etc/(passwd|shadow)$'
      - patterns:
          - pattern-either:
              - pattern: '$PATH.join($HOME, ".env", ...)'
              - pattern: '$PATH.resolve($HOME, ".env", ...)'
              - pattern: 'join($HOME, ".env", ...)'
              - pattern: 'resolve($HOME, ".env", ...)'
          - metavariable-regex:
              metavariable: $HOME
              regex: '(?i)(homedir|HOME|USERPROFILE)'
      - patterns:
          - pattern-either:
              - pattern: '$A + "$B"'
              - pattern: '`...`'
          - pattern-regex: '(?i)([/\\~](\.ssh|\.aws|\.npmrc|\.netrc|\.kube|\.gnupg|\.config[/\\](gcloud|gh|kube)|id_rsa|id_ed25519)|/etc/passwd|/etc/shadow|(~|homedir\(\)\}?)[/\\]\.env\b)'