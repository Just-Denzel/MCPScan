name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  banco-de-pruebas-compila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias (sin scripts)
        run: npm install --prefix corpus/banco_de_pruebas --no-save --ignore-scripts @modelcontextprotocol/sdk@1.32.2 zod@4.6.7 typescript@7.0.2 @types/node@26.6.5
      - name: Compilar los servidores con tsc
        run: corpus/banco_de_pruebas/node_modules/.bin/tsc -p frente_c_pipeline/tsconfig.banco.json
